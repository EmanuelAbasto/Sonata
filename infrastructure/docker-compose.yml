services:
  postgres:
    image: postgres:16-alpine
    container_name: audio-uploader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - audio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: audio-uploader-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - audio-network

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: audio-uploader-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_UPDATE: "off"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - audio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:0.6.5
    container_name: audio-uploader-ollama
    restart: unless-stopped
    runtime: nvidia
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_HOST: 0.0.0.0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - audio-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  ollama-init:
    image: ollama/ollama:0.6.5
    container_name: audio-uploader-ollama-init
    restart: "no"
    runtime: nvidia
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      sh -c "
        until ollama list >/dev/null 2>&1; do sleep 2; done &&
        ollama pull llama3.2
      "
    depends_on:
      ollama:
        condition: service_started
    networks:
      - audio-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: audio-uploader-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - audio-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    image: registry.gitlab.com/jala-university1/cohort-2/es.cspr-471.ga.t2.26.m1/sb/emanuel.abasto/mcsv-audio-uploader:laboratory-9
    container_name: audio-uploader-app
    restart: unless-stopped
    runtime: nvidia
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      HF_TOKEN: ${HF_TOKEN}
      FFMPEG_PATH: ${FFMPEG_PATH}
      PYTHON_PATH: ${PYTHON_PATH}
      WHISPER_SCRIPT_PATH: ${WHISPER_SCRIPT_PATH}
      WHISPER_MODEL: ${WHISPER_MODEL}
      SUMMARY_SCRIPT_PATH: ${SUMMARY_SCRIPT_PATH}
      SUMMARY_MODEL: ${SUMMARY_MODEL}
      SUMMARY_MAX_LENGTH: ${SUMMARY_MAX_LENGTH}
      SUMMARY_MIN_LENGTH: ${SUMMARY_MIN_LENGTH}
      OLLAMA_URL: ${OLLAMA_URL}
      BATCH_SIZE: ${BATCH_SIZE}
      BATCH_INTERVAL_SECONDS: ${BATCH_INTERVAL_SECONDS}
      MAX_CONCURRENT_COMPRESSIONS: ${MAX_CONCURRENT_COMPRESSIONS}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_TRANSCRIPTION_QUEUE: ${RABBITMQ_TRANSCRIPTION_QUEUE}
      RABBITMQ_SUMMARY_QUEUE: ${RABBITMQ_SUMMARY_QUEUE}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      PRECARGA_MODELO: "true"
      WHISPER_DEVICE: "cuda"
      WHISPER_COMPUTE_TYPE: "float16"
    ports:
      - "${APP_PORT:-5247}:5247"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - audio-network
    volumes:
      - whisper_cache:/home/appuser/.cache/whisper

  frontend:
    image: registry.gitlab.com/jala-university1/cohort-2/es.cspr-471.ga.t2.26.m1/sb/emanuel.abasto/frontend/audio-uploader-frontend:latest
    container_name: audio-uploader-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - app
    networks:
      - audio-network

networks:
  audio-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  whisper_cache:
  rabbitmq_data: